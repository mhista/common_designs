name: common_designs
description: A comprehensive, production-grade design system with robust animations for Flutter apps. Inspired by modern e-commerce interfaces with smooth transitions, interactive animations, and beautiful typography.
version: 1.1.1
# publish_to: "none" # Remove this line if you wish to publish to pub.dev
homepage: https://github.com/mhista/common_designs
repository: https://github.com/mhista/common_designs
issue_tracker: https://github.com/mhista/common_designs/issues
environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.0
  modal_bottom_sheet: ^3.0.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  # common_utils2:
    # path: ../common_utils
  cached_network_image: ^3.4.1
  common_utils2: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

